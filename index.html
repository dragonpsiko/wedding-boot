<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kathakala Photobooth</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #f7f4f0;
      color: #333;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px 15px;
    }

    header {
      text-align: center;
      margin-bottom: 15px;
    }

    header h1 {
      font-family: 'Georgia', serif;
      font-size: 1.6rem;
      color: #4a3b32;
    }

    header p {
      font-size: 0.85rem;
      color: #7a6a5d;
      margin-top: 4px;
    }

    /* Kunci wadah persis di rasio 3:4 (Portrait 4:3) */
    .booth-container {
      position: relative;
      width: 100%;
      max-width: 380px;
      aspect-ratio: 3 / 4;
      background-color: #000;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0,0,0,0.15);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Video memenuhi container tanpa terpotong (fit 4:3) */
    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
    }

    .frame-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      object-fit: fill;
    }

    .controls {
      margin-top: 15px;
      display: flex;
      gap: 10px;
      width: 100%;
      max-width: 380px;
    }

    button {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 25px;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
    }

    .btn-capture {
      background-color: #8c6d58;
      color: white;
    }

    .btn-switch {
      background-color: #e2d7cd;
      color: #4a3b32;
      flex: 0.35;
    }

    .result-container {
      display: none;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 380px;
    }

    canvas {
      display: none;
    }

    #photo-result {
      width: 100%;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.15);
    }

    .btn-download {
      background-color: #2e7d32;
      color: white;
      margin-top: 15px;
      text-decoration: none;
      text-align: center;
      display: block;
      width: 100%;
      padding: 12px;
      border-radius: 25px;
      font-weight: 600;
    }

    .btn-retake {
      background-color: #d32f2f;
      color: white;
      margin-top: 8px;
    }

    #upload-status {
      margin-top: 10px;
      font-size: 0.8rem;
      color: #666;
    }
  </style>
</head>
<body>

  <header>
    <h1>Kathakala</h1>
    <p>Virtual Photobooth — Scan, Snap & Download</p>
  </header>

  <div id="booth-screen">
    <div class="booth-container">
      <video id="webcam" autoplay playsinline></video>
      <img id="frame-img" class="frame-overlay" src="frame.png" alt="Frame Wedding">
    </div>

    <div class="controls">
      <button class="btn-switch" onclick="switchCamera()">🔄 Flip</button>
      <button class="btn-capture" onclick="takePhoto()">📸 Ambil Foto</button>
    </div>
  </div>

  <div id="result-screen" class="result-container">
    <img id="photo-result" alt="Hasil Foto">
    <a id="download-link" class="btn-download" download="kathakala-photo.jpg">📥 Simpan Foto</a>
    <button class="btn-retake" onclick="resetPhoto()">🔄 Foto Ulang</button>
    <p id="upload-status"></p>
  </div>

  <canvas id="canvas"></canvas>

  <script>
    const video = document.getElementById('webcam');
    const canvas = document.getElementById('canvas');
    const frameImg = document.getElementById('frame-img');
    const photoResult = document.getElementById('photo-result');
    const downloadLink = document.getElementById('download-link');
    const boothScreen = document.getElementById('booth-screen');
    const resultScreen = document.getElementById('result-screen');
    const uploadStatus = document.getElementById('upload-status');

    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzKzgjeXSZo1l7q1hGmHs7kwQSEJulvpVIOYmhvbi4drJClS0o6C_0X2sDrIkBRsCrP_A/exec";

    let currentStream = null;
    let facingMode = "user";

    async function startCamera() {
      if (currentStream) {
        currentStream.getTracks().forEach(track => track.stop());
      }

      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { 
            facingMode: facingMode, 
            width: { ideal: 1440, min: 1080 },
            height: { ideal: 1920, min: 1440 }
          },
          audio: false
        });
        currentStream = stream;
        video.srcObject = stream;
      } catch (err) {
        alert("Akses kamera ditolak atau tidak didukung di browser ini.");
        console.error(err);
      }
    }

    function switchCamera() {
      facingMode = facingMode === "user" ? "environment" : "user";
      video.style.transform = facingMode === "user" ? "scaleX(-1)" : "scaleX(1)";
      startCamera();
    }

    function takePhoto() {
      const context = canvas.getContext('2d');
      
      const renderWidth = 1080;
      const renderHeight = 1440;
      
      canvas.width = renderWidth;
      canvas.height = renderHeight;

      // Fitur smoothing/pemulusan gambar
      context.imageSmoothingEnabled = true;
      context.imageSmoothingQuality = 'high';

      context.save();
      
      if (facingMode === "user") {
        context.translate(renderWidth, 0);
        context.scale(-1, 1);
      }
      
      const videoRatio = video.videoWidth / video.videoHeight;
      const canvasRatio = renderWidth / renderHeight;
      let sx = 0, sy = 0, sw = video.videoWidth, sh = video.videoHeight;

      if (videoRatio > canvasRatio) {
        sw = video.videoHeight * canvasRatio;
        sx = (video.videoWidth - sw) / 2;
      } else {
        sh = video.videoWidth / canvasRatio;
        sy = (video.videoHeight - sh) / 2;
      }

      context.drawImage(video, sx, sy, sw, sh, 0, 0, renderWidth, renderHeight);
      context.restore();

      // Gambar frame jika file frame.png ter-load dengan baik
      if (frameImg.complete && frameImg.naturalWidth !== 0) {
        context.drawImage(frameImg, 0, 0, renderWidth, renderHeight);
      }

      // Format JPEG kualitas tinggi (0.95) untuk mengurangi efek pasir/noise
      const imageData = canvas.toDataURL('image/jpeg', 0.95);
      photoResult.src = imageData;
      downloadLink.href = imageData;

      boothScreen.style.display = "none";
      resultScreen.style.display = "flex";

      uploadToGoogleDrive(imageData);
    }

    function uploadToGoogleDrive(base64Image) {
      if (!GOOGLE_SCRIPT_URL) return;

      uploadStatus.innerText = "Menyimpan ke album acara...";

      fetch(GOOGLE_SCRIPT_URL, {
        method: "POST",
        body: JSON.stringify({ image: base64Image }),
        headers: { "Content-Type": "text/plain;charset=utf-8" }
      })
      .then(res => res.json())
      .then(data => {
        if(data.result === "success") {
          uploadStatus.innerText = "✨ Foto tersimpan di album acara!";
        } else {
          uploadStatus.innerText = "";
        }
      })
      .catch(err => {
        console.error(err);
        uploadStatus.innerText = "";
      });
    }

    function resetPhoto() {
      uploadStatus.innerText = "";
      resultScreen.style.display = "none";
      boothScreen.style.display = "block";
    }

    window.onload = startCamera;
  </script>
</body>
</html>
