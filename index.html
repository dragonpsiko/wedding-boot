<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="page-title">Wedding Photobooth</title>
  
  <!-- Font Serif Elegan & Modern Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="css/wedding-style.css">
</head>
<body>

  <main class="app-container">
    
    <!-- LAYAR 0: ELEGANT WEDDING LANDING -->
    <section id="landing-screen" class="screen active">
      <div class="wedding-card">
        
        <!-- Frame Foto Prewedding -->
        <div class="hero-frame">
          <img id="wedding-hero-img" src="" alt="Foto Pengantin">
        </div>

        <div class="wedding-header">
          <span class="wedding-hashtag" id="wedding-hashtag">#HashtagWedding</span>
          <h1 class="couple-names" id="couple-names">Groom & Bride</h1>
          <p class="wedding-date" id="wedding-date">Date</p>
        </div>

        <div class="wedding-divider">✦</div>

        <p class="wedding-message" id="wedding-message">
          Ucapan selamat datang...
        </p>

        <button class="btn-wedding-primary" onclick="goToBooth()">
          Abadikan Momen 📸
        </button>

        <footer class="wedding-footer">
          <p>Digital Photobooth Powered by <strong id="brand-tag">Kathakala</strong></p>
        </footer>
      </div>
    </section>

    <!-- LAYAR 1: BOOTH KAMERA & FILTER -->
    <section id="booth-screen" class="screen">
      <div class="booth-header">
        <span class="mini-initials" id="mini-initials">S & R</span>
        <h2>Photo Booth</h2>
      </div>

      <div class="booth-container">
        <video id="webcam" class="filter-normal" autoplay playsinline></video>
        <div id="flash" class="flash-overlay"></div>
        
        <div id="timer-overlay" class="timer-overlay">
          <div id="timer-number" class="timer-number">3</div>
          <div id="pose-indicator" class="pose-indicator">Siap-siap Pose 1</div>
        </div>
      </div>

      <!-- Filter Pilihan Tamu -->
      <div class="filter-selector">
        <button class="filter-btn active" onclick="setFilter('normal', this)">Normal</button>
        <button class="filter-btn" onclick="setFilter('beauty', this)">Soft Glow ✨</button>
        <button class="filter-btn" onclick="setFilter('radiant', this)">Warm Romance</button>
        <button class="filter-btn" onclick="setFilter('bw', this)">Classic B&W</button>
        <button class="filter-btn" onclick="setFilter('vintage', this)">Vintage</button>
      </div>

      <div class="controls-row">
        <button class="btn-secondary flex-04" id="btn-flip" onclick="switchCamera()">🔄 Flip</button>
        <button class="btn-wedding-primary flex-1" id="btn-start" onclick="startMultiPoseSession()">📸 Mulai Jepret</button>
      </div>
      <button class="btn-ghost" onclick="goToLanding()">← Kembali</button>
    </section>

    <!-- LAYAR 2: HASIL FOTO & DOAMU UNTUK MEMPELAI -->
    <section id="result-screen" class="screen">
      <div class="result-header">
        <h2>Foto Kamu Siap! 🎉</h2>
        <p>Simpan fotomu sebagai kenang-kenangan hari bahagia ini.</p>
      </div>

      <div class="result-card">
        <img id="photo-result" alt="Hasil Foto Wedding">
      </div>

      <!-- Form Ucapan Doa Singkat dari Tamu -->
      <div class="wishes-box">
        <label for="guest-name">Nama Kamu:</label>
        <input type="text" id="guest-name" placeholder="Contoh: Budi & Teman-teman">
        
        <label for="guest-wish">Pesan & Doa untuk Mempelai:</label>
        <textarea id="guest-wish" rows="2" placeholder="Selamat atas pernikahannya! Bahagia selalu..."></textarea>
      </div>

      <button id="btn-download" class="btn-wedding-primary full-width" onclick="savePhotoAndWish()">
        📥 Download Foto & Kirim Doa
      </button>
      <button class="btn-secondary full-width" onclick="resetPhoto()">🔄 Foto Ulang</button>
      <p id="upload-status"></p>
    </section>

    <canvas id="canvas"></canvas>
  </main>

  <!-- Script Konfigurasi Khusus Wedding -->
  <script src="js/wedding-config.js"></script>
  <!-- Logic App Khusus Wedding -->
  <script src="js/wedding-app.js"></script>
</body>
</html>
